<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padboard — offline soundboard</title>
<style>
  :root{
    --bg: #1b1712;
    --pad: #2c261e;
    --pad-hover: #362f25;
    --pad-empty-border: #4a4033;
    --ink: #f2ead9;
    --ink-dim: #a89a83;
    --amber: #e8963e;
    --amber-dim: #6e5326;
    --rose: #c96b5e;
    --line: #3a3327;
    --sidebar-bg: #17130f;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 15% -10%, #2a2117 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #201a13 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
  }
  .app{
    display:flex;
    max-width: 1180px;
    margin: 0 auto;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* --- sidebar --- */
  .sidebar{
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    min-height: 100vh;
    padding: 22px 14px;
    border-right: 1px solid var(--line);
    position: sticky;
    top: 0;
  }
  .sidebar h2{
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 4px 8px 14px;
  }
  .board-item{
    display:flex; align-items:center; justify-content:space-between;
    gap: 6px;
    padding: 10px 10px;
    border-radius: 9px;
    margin-bottom: 4px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .12s;
  }
  .board-item:hover{ background: #241f18; }
  .board-item.active{
    background: #2c2318;
    border-left: 3px solid var(--amber);
  }
  .board-item .b-name{
    font-size: 13.5px;
    font-weight: 600;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    outline: none;
  }
  .board-item .b-count{
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
  }
  .board-item .b-del{
    display:none;
    background:none; border:none; color: var(--ink-dim);
    font-size: 13px; cursor:pointer; padding: 2px 4px;
  }
  .board-item:hover .b-del{ display:inline-block; }
  .board-item .b-del:hover{ color: var(--rose); }

  .new-board-btn{
    width: 100%;
    margin-top: 8px;
    background: transparent;
    border: 1.5px dashed var(--pad-empty-border);
    color: var(--ink-dim);
    border-radius: 9px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .new-board-btn:hover{ border-color: var(--amber); color: var(--amber); }

  /* --- main --- */
  .main{ flex: 1; padding: 28px 26px 60px; min-width: 0; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px; margin-bottom: 26px;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .brand .eyebrow{
    font-family: ui-monospace, monospace; font-size: 11px;
    letter-spacing: .22em; color: var(--amber); text-transform: uppercase;
  }
  .brand h1{ margin:0; font-size: 24px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brand p{ margin: 2px 0 0; font-size: 13px; color: var(--ink-dim); }

  .controls{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  button{
    font-family: inherit; cursor:pointer; border-radius: 10px;
    border: 1px solid var(--line); background: var(--pad); color: var(--ink);
    padding: 10px 16px; font-size: 13px; font-weight: 600;
    transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover{ background: var(--pad-hover); border-color: var(--pad-empty-border); }
  button:active{ transform: scale(.97); }
  .btn-primary{ background: var(--amber); color: #241a0d; border-color: var(--amber); }
  .btn-primary:hover{ background: #f0a655; }

  .vol-row{ display:flex; align-items:center; gap:8px; font-size:12px; color: var(--ink-dim); font-family: ui-monospace, monospace; }
  input[type="range"]{ accent-color: var(--amber); width: 90px; }

  #grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  .pad{
    position: relative; aspect-ratio: 1 / 0.82;
    background: var(--pad); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display:flex; flex-direction:column; justify-content: space-between;
    cursor: pointer; overflow: hidden; user-select: none;
    transition: background .12s, transform .08s, border-color .15s;
  }
  .pad:hover{ background: var(--pad-hover); border-color: var(--pad-empty-border); }
  .pad:active{ transform: scale(.98); }
  .pad .num{ font-family: ui-monospace, monospace; font-size: 13px; color: var(--ink-dim); }
  .pad .name{
    font-size: 15px; line-height: 1.3; font-weight: 600; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; outline: none;
  }
  .pad .name[contenteditable="true"]{ background: #00000030; border-radius: 4px; padding: 2px 4px; cursor: text; }
  .pad .meta{
    display:flex; justify-content:space-between; align-items:center;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .05em;
    color: var(--ink-dim); text-transform: uppercase;
  }
  .pad.playing .meta{ color: var(--amber); }
  .pad .led{
    position:absolute; top: 12px; right: 12px; width: 7px; height:7px; border-radius:50%;
    background: var(--line); transition: all .15s;
  }
  .pad.playing .led{ background: var(--amber); box-shadow: 0 0 8px 2px #e8963e88; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .progress{ position:absolute; left:0; bottom:0; height: 3px; width: 0%; background: var(--amber); transition: width .05s linear; }
  .pad.playing{ border-color: var(--amber-dim); box-shadow: inset 0 0 0 1px #e8963e33; }
  .remove-btn{
    position:absolute; top: 8px; left: 8px; width: 20px; height:20px; border-radius: 6px;
    border: 1px solid var(--line); background: #1b1712cc; color: var(--ink-dim);
    font-size: 12px; line-height: 1; display:none; align-items:center; justify-content:center; padding: 0;
  }
  .pad:hover .remove-btn{ display:flex; }
  .remove-btn:hover{ color: var(--rose); border-color: var(--rose); }
  .pad-empty{ background: transparent; border: 1.5px dashed var(--pad-empty-border); align-items:center; justify-content:center; color: var(--ink-dim); font-size: 28px; font-weight: 300; }
  .pad-empty:hover{ border-color: var(--amber); color: var(--amber); background: #e8963e0d; }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-dim); border: 1.5px dashed var(--pad-empty-border); border-radius: var(--radius); }
  .empty-state.drag-over{ border-color: var(--amber); color: var(--amber); background: #e8963e0d; }
  .empty-state h3{ color: var(--ink); margin: 0 0 6px; font-size:17px; }
  .empty-state p{ margin:0 0 18px; font-size:13px; }
  #grid.drag-over{ outline: 1.5px dashed var(--amber); outline-offset: 8px; border-radius: 18px; }

  footer{ margin-top: 26px; font-size: 12px; color: var(--ink-dim); text-align:center; }
  footer kbd{ font-family: ui-monospace, monospace; background: var(--pad); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }

  @media (max-width: 720px){
    .app{ flex-direction: column; }
    .sidebar{ width: 100%; min-height: auto; position: static; border-right:none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <h2>Soundboards</h2>
    <div id="boardList"></div>
    <button class="new-board-btn" id="newBoardBtn">+ New soundboard</button>
  </aside>

  <main class="main">
    <header>
      <div class="brand">
        <span class="eyebrow">Padboard</span>
        <h1 id="boardTitle">Board</h1>
        <p>Click a pad to fire it. Everything's saved on this device.</p>
      </div>
      <div class="controls">
        <div class="vol-row">VOL <input id="vol" type="range" min="0" max="100" value="80"></div>
        <button id="stopAllBtn">Stop all</button>
        <button id="importBtn" class="btn-primary">+ Import sounds</button>
      </div>
    </header>

    <div id="gridWrap">
      <div id="emptyState" class="empty-state">
        <h3>No sounds yet on this board</h3>
        <p>Drag audio files here, or import from your device.</p>
        <button id="importBtn2" class="btn-primary">+ Import sounds</button>
      </div>
      <div id="grid" style="display:none;"></div>
    </div>

    <footer>
      Number keys <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> trigger the first 10 pads · double‑click a name to rename · hover a pad to delete it
    </footer>
  </main>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

<script>
  /* ---------- IndexedDB layer ---------- */
  const DB_NAME = 'padboardDB';
  const DB_VERSION = 1;
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const _db = e.target.result;
        if(!_db.objectStoreNames.contains('boards')){
          _db.createObjectStore('boards', { keyPath: 'id' });
        }
        if(!_db.objectStoreNames.contains('sounds')){
          const s = _db.createObjectStore('sounds', { keyPath: 'id' });
          s.createIndex('boardId', 'boardId', { unique: false });
        }
        if(!_db.objectStoreNames.contains('meta')){
          _db.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function tx(storeNames, mode){
    return db.transaction(storeNames, mode);
  }
  function reqToPromise(req){
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetAll(store){
    const t = tx([store], 'readonly');
    return reqToPromise(t.objectStore(store).getAll());
  }
  async function dbPut(store, value){
    const t = tx([store], 'readwrite');
    return reqToPromise(t.objectStore(store).put(value));
  }
  async function dbDelete(store, key){
    const t = tx([store], 'readwrite');
    return reqToPromise(t.objectStore(store).delete(key));
  }
  async function dbGetSoundsByBoard(boardId){
    const t = tx(['sounds'], 'readonly');
    const idx = t.objectStore('sounds').index('boardId');
    return reqToPromise(idx.getAll(IDBKeyRange.only(boardId)));
  }

  /* ---------- state ---------- */
  let boards = [];        // {id, name, createdAt}
  let activeBoardId = null;
  let pads = [];          // in-memory: {id, boardId, name, type, blob, audio, url}
  let idCounter = 0;

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const fileInput = document.getElementById('fileInput');
  const volSlider = document.getElementById('vol');
  const boardListEl = document.getElementById('boardList');
  const boardTitleEl = document.getElementById('boardTitle');

  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + (idCounter++); }

  /* ---------- boards ---------- */
  async function loadBoards(){
    boards = await dbGetAll('boards');
    if(boards.length === 0){
      const b = { id: uid('board'), name: 'Board 1', createdAt: Date.now() };
      await dbPut('boards', b);
      boards = [b];
    }
    boards.sort((a,b) => a.createdAt - b.createdAt);

    const metaRow = await new Promise(resolve => {
      const t = tx(['meta'], 'readonly');
      reqToPromise(t.objectStore('meta').get('activeBoardId')).then(resolve).catch(()=>resolve(null));
    });
    activeBoardId = (metaRow && boards.some(b=>b.id===metaRow.value)) ? metaRow.value : boards[0].id;
  }

  async function setActiveBoard(id){
    activeBoardId = id;
    await dbPut('meta', { key: 'activeBoardId', value: id });
    await loadPadsForActiveBoard();
    renderBoardList();
    renderGrid();
    updateTitle();
  }

  function updateTitle(){
    const b = boards.find(b => b.id === activeBoardId);
    boardTitleEl.textContent = b ? b.name : 'Board';
  }

  function renderBoardList(){
    boardListEl.innerHTML = '';
    boards.forEach(b => {
      const count = pads.filter ? undefined : undefined; // placeholder, replaced below via countCache
      const row = document.createElement('div');
      row.className = 'board-item' + (b.id === activeBoardId ? ' active' : '');
      row.innerHTML = `
        <span class="b-name" data-id="${b.id}" contenteditable="false" spellcheck="false">${escapeHtml(b.name)}</span>
        <button class="b-del" title="Delete board">🗑</button>
      `;
      row.addEventListener('click', (e) => {
        if(e.target.closest('.b-del') || row.querySelector('.b-name').isContentEditable) return;
        if(b.id !== activeBoardId) setActiveBoard(b.id);
      });
      const nameEl = row.querySelector('.b-name');
      nameEl.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        nameEl.contentEditable = 'true';
        nameEl.focus();
        document.getSelection().selectAllChildren(nameEl);
      });
      nameEl.addEventListener('blur', async () => {
        nameEl.contentEditable = 'false';
        const newName = nameEl.textContent.trim() || b.name;
        b.name = newName;
        nameEl.textContent = newName;
        await dbPut('boards', b);
        if(b.id === activeBoardId) updateTitle();
      });
      nameEl.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); nameEl.blur(); } });
      row.querySelector('.b-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        if(boards.length === 1){ alert("You need at least one soundboard."); return; }
        if(!confirm(`Delete "${b.name}" and all its sounds? This can't be undone.`)) return;
        const soundsToDelete = await dbGetSoundsByBoard(b.id);
        for(const s of soundsToDelete) await dbDelete('sounds', s.id);
        await dbDelete('boards', b.id);
        boards = boards.filter(x => x.id !== b.id);
        if(activeBoardId === b.id){
          await setActiveBoard(boards[0].id);
        } else {
          renderBoardList();
        }
      });
      boardListEl.appendChild(row);
    });
  }

  document.getElementById('newBoardBtn').addEventListener('click', async () => {
    const b = { id: uid('board'), name: `Board ${boards.length + 1}`, createdAt: Date.now() };
    await dbPut('boards', b);
    boards.push(b);
    await setActiveBoard(b.id);
  });

  /* ---------- pads ---------- */
  function extFromName(name){
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop().toUpperCase() : 'AUDIO';
  }

  function teardownPads(){
    pads.forEach(p => { p.audio.pause(); URL.revokeObjectURL(p.url); });
    pads = [];
  }

  async function loadPadsForActiveBoard(){
    teardownPads();
    const rows = await dbGetSoundsByBoard(activeBoardId);
    rows.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
    pads = rows.map(r => {
      const url = URL.createObjectURL(r.blob);
      const audio = new Audio(url);
      audio.preload = 'metadata';
      const pad = { id: r.id, boardId: r.boardId, name: r.name, type: r.type, blob: r.blob, order: r.order, audio, url };
      audio.addEventListener('play', () => setPlaying(pad.id, true));
      audio.addEventListener('pause', () => setPlaying(pad.id, false));
      audio.addEventListener('ended', () => setPlaying(pad.id, false));
      audio.addEventListener('timeupdate', () => updateProgress(pad.id));
      return pad;
    });
  }

  function setPlaying(id, isPlaying){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('playing', isPlaying);
    const metaType = el.querySelector('.meta-type');
    if(metaType) metaType.textContent = isPlaying ? 'Playing' : pads.find(p=>p.id===id).type;
  }

  function updateProgress(id){
    const pad = pads.find(p => p.id === id);
    const el = document.getElementById(id);
    if(!pad || !el) return;
    const bar = el.querySelector('.progress');
    if(pad.audio.duration) bar.style.width = (pad.audio.currentTime / pad.audio.duration * 100) + '%';
  }

  function triggerPad(pad){
    pad.audio.currentTime = 0;
    pad.audio.volume = volSlider.value / 100;
    pad.audio.play();
  }

  async function addFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name));
    let order = pads.length;
    for(const file of files){
      const id = uid('sound');
      const record = {
        id, boardId: activeBoardId,
        name: file.name.replace(/\.[^/.]+$/, ''),
        type: extFromName(file.name),
        blob: file,
        order: order++
      };
      await dbPut('sounds', record);
      const url = URL.createObjectURL(file);
      const audio = new Audio(url);
      audio.preload = 'metadata';
      const pad = { ...record, audio, url };
      audio.addEventListener('play', () => setPlaying(pad.id, true));
      audio.addEventListener('pause', () => setPlaying(pad.id, false));
      audio.addEventListener('ended', () => setPlaying(pad.id, false));
      audio.addEventListener('timeupdate', () => updateProgress(pad.id));
      pads.push(pad);
    }
    renderGrid();
    renderBoardList();
  }

  async function removePad(id){
    const pad = pads.find(p => p.id === id);
    if(pad){ pad.audio.pause(); URL.revokeObjectURL(pad.url); }
    pads = pads.filter(p => p.id !== id);
    await dbDelete('sounds', id);
    renderGrid();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function refreshEmptyState(){
    if(pads.length === 0){ emptyState.style.display = 'block'; grid.style.display = 'none'; }
    else { emptyState.style.display = 'none'; grid.style.display = 'grid'; }
  }

  function renderGrid(){
    grid.innerHTML = '';
    pads.forEach((pad, i) => {
      const el = document.createElement('div');
      el.className = 'pad';
      el.id = pad.id;
      el.innerHTML = `
        <div class="led"></div>
        <button class="remove-btn" title="Delete">×</button>
        <span class="num">${i+1}</span>
        <div class="name" contenteditable="false" spellcheck="false">${escapeHtml(pad.name)}</div>
        <div class="meta"><span class="meta-type">${pad.type}</span></div>
        <div class="progress"></div>
      `;
      el.addEventListener('click', (e) => {
        if(e.target.closest('.remove-btn') || el.querySelector('.name').isContentEditable) return;
        triggerPad(pad);
      });
      el.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removePad(pad.id); });
      const nameEl = el.querySelector('.name');
      nameEl.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        nameEl.contentEditable = 'true';
        nameEl.focus();
        document.getSelection().selectAllChildren(nameEl);
      });
      nameEl.addEventListener('blur', async () => {
        nameEl.contentEditable = 'false';
        pad.name = nameEl.textContent.trim() || pad.name;
        nameEl.textContent = pad.name;
        await dbPut('sounds', { id: pad.id, boardId: pad.boardId, name: pad.name, type: pad.type, blob: pad.blob, order: pad.order });
      });
      nameEl.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); nameEl.blur(); } });
      grid.appendChild(el);
    });

    const addTile = document.createElement('div');
    addTile.className = 'pad pad-empty';
    addTile.textContent = '+';
    addTile.addEventListener('click', () => fileInput.click());
    grid.appendChild(addTile);

    refreshEmptyState();
  }

  /* ---------- global controls ---------- */
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('importBtn2').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });

  document.getElementById('stopAllBtn').addEventListener('click', () => {
    pads.forEach(p => { p.audio.pause(); p.audio.currentTime = 0; });
  });
  volSlider.addEventListener('input', () => { pads.forEach(p => { p.audio.volume = volSlider.value / 100; }); });

  const gridWrap = document.getElementById('gridWrap');
  ['dragover'].forEach(evt => gridWrap.addEventListener(evt, (e) => {
    e.preventDefault(); grid.classList.add('drag-over'); emptyState.classList.add('drag-over');
  }));
  ['dragleave','drop'].forEach(evt => gridWrap.addEventListener(evt, (e) => {
    e.preventDefault(); grid.classList.remove('drag-over'); emptyState.classList.remove('drag-over');
  }));
  gridWrap.addEventListener('drop', (e) => { if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  document.addEventListener('keydown', (e) => {
    if(document.activeElement && document.activeElement.isContentEditable) return;
    const key = e.key;
    let index = -1;
    if(key >= '1' && key <= '9') index = parseInt(key,10) - 1;
    else if(key === '0') index = 9;
    if(index >= 0 && pads[index]){ e.preventDefault(); triggerPad(pads[index]); }
  });

  /* ---------- boot ---------- */
  (async function init(){
    db = await openDB();
    await loadBoards();
    await loadPadsForActiveBoard();
    renderBoardList();
    renderGrid();
    updateTitle();
  })();
</script>
</body>
</html>
